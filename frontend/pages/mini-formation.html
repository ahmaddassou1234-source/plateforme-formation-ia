<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer une mini-formation — Formation en IA</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="fr-header">
        <div class="fr-container fr-header__body">
            <div class="fr-header__brand"><img src="../img/logo-menps.png" alt="Ministère de l'Éducation Nationale, du Préscolaire et des Sports" class="menps-logo"><div class="fr-header__service"><p class="fr-header__service-title">Formation en IA</p></div></div>
            <div class="fr-header__tools"><div id="user-menu"><span id="user-name"></span><button onclick="logout()" class="fr-btn fr-btn--tertiary">Déconnexion</button></div></div>
        </div>
        <nav class="fr-nav"><div class="fr-container"><ul class="fr-nav__list">
            <li><a class="fr-nav__link" href="../index.html">Accueil</a></li>
            <li><a class="fr-nav__link" href="modules.html">Catalogue</a></li>
            <li><a class="fr-nav__link" href="progression.html">Ma progression</a></li>
            <li><a class="fr-nav__link fr-nav__link--active" href="mini-formation.html">Mini-formations</a></li>
        </ul></div></nav>
    </header>

    <main class="fr-container fr-py-6w">
        <h1 style="color:var(--blue-france);margin-bottom:0.5rem">Créer une mini-formation</h1>
        <p style="margin-bottom:2rem">Partagez vos bonnes pratiques d'usage de l'IA avec vos collègues enseignants en concevant un court support de formation entre pairs.</p>
        <div id="alert" class="fr-alert hidden"></div>

        <div class="fr-card fr-mb-2w"><div class="fr-card__body">
            <form id="mini-form">
                <div class="fr-grid-row fr-grid-row--gutters">
                    <div class="fr-col-12 fr-col-md-6"><div class="fr-form-group"><label class="fr-label" for="mf-titre">Titre</label><input type="text" id="mf-titre" class="fr-input" required></div></div>
                    <div class="fr-col-12 fr-col-md-6"><div class="fr-form-group"><label class="fr-label" for="mf-theme">Thème</label><input type="text" id="mf-theme" class="fr-input" required></div></div>
                    <div class="fr-col-12"><div class="fr-form-group"><label class="fr-label" for="mf-desc">Description courte</label><textarea id="mf-desc" class="fr-input" rows="2" required></textarea></div></div>
                    <div class="fr-col-12"><div class="fr-form-group"><label class="fr-label" for="mf-contenu">Contenu du support (texte)</label><textarea id="mf-contenu" class="fr-input" rows="6" placeholder="Décrivez ici la pratique ou l'astuce que vous souhaitez transmettre à vos pairs..."></textarea></div></div>
                </div>
                <button type="submit" class="fr-btn">Publier la mini-formation</button>
            </form>
        </div></div>

        <h2 class="fr-mb-2w">Mes mini-formations</h2>
        <div id="mes-creations"></div>
    </main>

    <script src="../js/app.js"></script>
    <script>
        requireAuth(); updateHeader();
        if (getUser()?.role !== 'Enseignant') window.location.href = 'modules.html';

        document.getElementById('mini-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await api('/modules/mini-formation', { method: 'POST', body: {
                    titre: document.getElementById('mf-titre').value,
                    theme: document.getElementById('mf-theme').value,
                    description: document.getElementById('mf-desc').value,
                    contenuTexte: document.getElementById('mf-contenu').value || null
                }});
                showAlert('alert', 'Mini-formation publiée avec succès !', 'success');
                document.getElementById('mini-form').reset();
                loadMesCreations();
            } catch (err) { showAlert('alert', err.message, 'error'); }
        });

        async function loadMesCreations() {
            try {
                const modules = await api('/modules?mesCreations=1');
                const container = document.getElementById('mes-creations');
                if (modules.length === 0) { container.innerHTML = '<p>Vous n\'avez pas encore créé de mini-formation.</p>'; return; }
                container.innerHTML = `<div class="fr-grid-row fr-grid-row--gutters">${modules.map(m => `
                    <div class="fr-col-12 fr-col-md-6"><div class="fr-card"><div class="fr-card__body">
                        <span class="fr-badge fr-badge--mini fr-mb-2w">Mini-formation</span>
                        <h3 class="fr-card__title">${m.titre}</h3>
                        <p class="fr-card__desc">${m.description || ''}</p>
                        <a href="module-detail.html?id=${m.id}" class="fr-btn fr-btn--secondary" style="margin-top:1rem">Voir</a>
                    </div></div></div>`).join('')}</div>`;
            } catch (e) { console.error(e); }
        }
        loadMesCreations();
    </script>
</body>
</html>
