<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Formation en IA</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="fr-header">
        <div class="fr-container fr-header__body">
            <div class="fr-header__brand">
                <img src="../img/logo-menps.png" alt="Ministère de l'Éducation Nationale, du Préscolaire et des Sports" class="menps-logo">
                <div class="fr-header__service">
                    <p class="fr-header__service-title">Formation en IA</p>
                </div>
            </div>
        </div>
    </header>

    <main class="fr-container">
        <div class="login-container">
            <h1>Se connecter</h1>
            <p class="login-subtitle">Choisissez votre profil pour accéder à votre espace</p>

            <div class="role-selector">
                <button type="button" class="role-option role-option--active" id="role-enseignant" onclick="selectRole('Enseignant')">
                    <span class="role-option__title">Enseignant(e)</span>
                    <span class="role-option__desc">Suivre les modules de formation, passer les quiz et créer des mini-formations</span>
                </button>
                <button type="button" class="role-option" id="role-administrateur" onclick="selectRole('Administrateur')">
                    <span class="role-option__title">Administrateur (DRPN)</span>
                    <span class="role-option__desc">Ajouter des modules de formation, créer des quiz et suivre le pilote national</span>
                </button>
            </div>

            <div id="alert" class="fr-alert hidden"></div>

            <form id="login-form">
                <div class="fr-form-group">
                    <label class="fr-label" for="email">Adresse électronique</label>
                    <input type="email" id="email" class="fr-input" required placeholder="prenom.nom@men.gov.ma">
                </div>
                <div class="fr-form-group">
                    <label class="fr-label" for="password">Mot de passe</label>
                    <input type="password" id="password" class="fr-input" required placeholder="••••••••">
                </div>
                <button type="submit" class="fr-btn" style="width:100%" id="login-submit-btn">Se connecter en tant qu'enseignant(e)</button>
            </form>
        </div>
    </main>

    <script src="../js/app.js"></script>
    <script>
        let selectedRole = 'Enseignant';
        function selectRole(role) {
            selectedRole = role;
            document.getElementById('role-enseignant').classList.toggle('role-option--active', role === 'Enseignant');
            document.getElementById('role-administrateur').classList.toggle('role-option--active', role === 'Administrateur');
            document.getElementById('login-submit-btn').textContent = role === 'Administrateur'
                ? "Se connecter en tant qu'administrateur"
                : "Se connecter en tant qu'enseignant(e)";
            document.getElementById('alert').classList.add('hidden');
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const data = await api('/auth/login', { method: 'POST', body: { email, motDePasse: password } });
                if (data.user.role !== selectedRole) {
                    showAlert('alert', `Ce compte n'est pas un compte ${selectedRole === 'Administrateur' ? 'administrateur' : 'enseignant'}. Sélectionnez le bon profil ci-dessus.`, 'error');
                    return;
                }
                setAuth(data.token, data.user);
                window.location.href = selectedRole === 'Administrateur' ? 'admin.html' : 'dashboard.html';
            } catch (error) { showAlert('alert', error.message, 'error'); }
        });
    </script>
</body>
</html>
